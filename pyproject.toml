[build-system]
requires = ["setuptools>=64", "pybind11>=2.10", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evacam_py"
version = "0.1.0"
description = "Python bindings for the EvaCAM CAM-array simulator (pybind11 over the C++ core)"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Notre Dame HW-SW Codesign Lab" }]

[project.urls]
Homepage = "https://github.com/Notre-Dame-HW-SW-Codesign-Lab/evacam"

[tool.setuptools]
packages = ["evacam"]
include-package-data = true

[tool.setuptools.package-data]
evacam = [
  "data/config/lib/sense_amp/*.yaml",
  "data/config/lib/sensing/*.yaml",
  "data/config/lib/technology/*.yaml",
]
