# 2FeFET-TCAM Cell Configuration
# Memory cell definition for Ferroelectric FET TCAM

cell:
  name: 2FeFET-TCAM
  type: FEFETRAM
  process_node_nm: 45
  area_F2: 300
  aspect_ratio: 1.76

access_device:
  type: none
  cmos_width_F: 1.0
  voltage_drop_V: 0.15

resistance:
  on_ohm: 10000
  off_ohm: 1.6e9

read:
  mode: voltage
  voltage_V: 1.0
  current_uA: 5.62
  power_uW: 5.62
  min_sense_voltage_mV: 70

write:
  set:
    mode: voltage
    voltage_V: 4.0
    current_uA: 0.000005
    pulse_ns: 10
    energy_pJ: 0.00002
  reset:
    mode: voltage
    voltage_V: 4.0
    current_uA: 0.0000005
    pulse_ns: 10
    energy_pJ: 0.00002

multilevel:
  enabled: false

match:
  cmos_width_F: 3
  additional_cap_on_ml_fF: 33

ports:
  row:
    - id: 0
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width_F: 1.0
      is_nmos: true
      wire_width: 1.0
      voltages:
        set_lrs_V: 4.0
        set_mrs_V: 4.0
        reset_V: 4.0
        search0_V: 1.0
        search1_V: 1.0
    - id: 1
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width_F: 1.0
      is_nmos: true
      wire_width: 1.0
      voltages:
        set_lrs_V: 4.0
        set_mrs_V: 4.0
        reset_V: 4.0
        search0_V: 1.0
        search1_V: 1.0

  column:
    - id: 0
      type: matchline
      cmos_region: drain
      num_cmos: 1
      cmos_width_F: 1.0
      is_nmos: true
      wire_width: 1.0
      voltages:
        set_lrs_V: 1.0
        set_mrs_V: 1.0
        reset_V: 1.0
        search0_V: 0.0
        search1_V: 1.0
