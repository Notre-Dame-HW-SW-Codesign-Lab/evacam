# MRAM-4T2R-VLSIC12 Cell Configuration
# Memory cell definition

cell:
  name: MRAM-4T2R-VLSIC12
  type: MRAM
  process_node: 90nm
  area: 387.85F^2
  aspect_ratio: 1.7
access_device:
  type: diode
  cmos_width: 7.5F
  voltage_drop: 0.15V
resistance:
  'on': 1100ohm
  'off': 2500ohm
read:
  mode: voltage
  current: 70uA
  power: 16.5uW
  min_sense_voltage: 500mV
write:
  set:
    mode: current
    current: 80uA
    pulse: 10ns
    energy: 1pJ
  reset:
    mode: current
    current: 80uA
    pulse: 10ns
    energy: 1pJ
multilevel:
  enabled: false
match:
  cmos_width: 7.5F
ports:
  row:
    0:
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 7.5F
      is_nmos: true
      wire_width: 1.5F
      voltages:
        set_lrs: 1.2V
        set_mrs: 1.2V
        reset: 1.2V
        search0: 1.2V
        search1: 0V
    1:
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 7.5F
      is_nmos: true
      wire_width: 1.5F
      voltages:
        set_lrs: 1.2V
        set_mrs: 1.2V
        reset: 1.2V
        search0: 0V
        search1: 1.2V
    2:
      type: wordline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 15F
      is_nmos: true
      wire_width: 1.5F
      voltages:
        set_lrs: 1.2V
        set_mrs: 1.2V
        reset: 1.2V
        search0: 0V
        search1: 0V
  column:
    0:
      type: matchline
      cmos_region: diode
      num_cmos: 1
      cmos_width: 2F
      is_nmos: true
      wire_width: 1.5F
      voltages:
        set_lrs: 0V
        set_mrs: 0V
        reset: 0V
        search0: 0V
        search1: 0V
    1:
      type: bitline
      cmos_region: drain
      num_cmos: 1
      cmos_width: 15F
      is_nmos: false
      wire_width: 1.5F
      voltages:
        set_lrs: 1.2V
        set_mrs: 1.2V
        reset: 0V
        search0: 0V
        search1: 0V
    2:
      type: bitline
      cmos_region: none
      num_cmos: 0
      cmos_width: 0F
      is_nmos: true
      wire_width: 6F
      voltages:
        set_lrs: 0V
        set_mrs: 0V
        reset: 1.2V
        search0: 0V
        search1: 0V
