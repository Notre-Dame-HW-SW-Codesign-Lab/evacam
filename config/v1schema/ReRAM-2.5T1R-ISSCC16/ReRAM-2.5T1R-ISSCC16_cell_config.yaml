# ReRAM-2.5T1R-ISSCC16 Cell Configuration
# Memory cell definition

cell:
  name: ReRAM-2.5T1R-ISSCC16
  cam_type: TCAM
  type: memristor
  cell_process_node: 65nm
  area: 138.46F^2
  aspect_ratio: 9.0
access_device:
  type: cmos
  cmos_width: 3F
  voltage_drop: 0.15V
resistance:
  'on': 8000ohm
  'off': 1250000ohm
read:
  mode: current
  voltage: 0.25V
  power: 30uW
  min_sense_voltage: 25mV
write:
  set:
    mode: current
    current: 150uA
    pulse: 10ns
    energy: 1pJ
  reset:
    mode: current
    current: 150uA
    pulse: 10ns
    energy: 1pJ
match:
  cmos_width: 6F
ports:
  row:
    0:
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 6F
      is_nmos: true
      wire_width: 2F
      voltages:
        set_lrs: 1.8V
        set_mrs: 1.8V
        reset: 1.2V
        search0: 1.1V
        search1: 0V
    1:
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 3F
      is_nmos: false
      wire_width: 2F
      voltages:
        set_lrs: 0V
        set_mrs: 0V
        reset: 0V
        search0: 1.1V
        search1: 0V
    2:
      type: wordline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 6F
      is_nmos: true
      wire_width: 2F
      voltages:
        set_lrs: 1.1V
        set_mrs: 1.1V
        reset: 1.1V
        search0: 1.1V
        search1: 1.1V
    3:
      type: sourceline
      cmos_region: drain
      num_cmos: 1
      cmos_width: 6F
      is_nmos: true
      wire_width: 2F
      voltages:
        set_lrs: 1.2V
        set_mrs: 1.2V
        reset: 1.8V
        search0: 1.1V
        search1: 0V
    4:
      type: wordline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 6F
      is_nmos: true
      wire_width: 2F
      voltages:
        set_lrs: 1.1V
        set_mrs: 1.1V
        reset: 1.1V
        search0: 1.1V
        search1: 1.1V
    5:
      type: sourceline
      cmos_region: drain
      num_cmos: 1
      cmos_width: 0F
      is_nmos: true
      wire_width: 2F
      voltages:
        set_lrs: 1.2V
        set_mrs: 1.2V
        reset: 1.8V
        search0: 1.1V
        search1: 0V
  column:
    0:
      type: matchline
      cmos_region: drain
      num_cmos: 1
      cmos_width: 3F
      is_nmos: true
      wire_width: 1F
      voltages:
        set_lrs: 0V
        set_mrs: 0V
        reset: 0V
        search0: 1.1V
        search1: 1.1V
    1:
      type: bitline
      cmos_region: drain
      num_cmos: 1
      cmos_width: 6F
      is_nmos: true
      wire_width: 1F
      voltages:
        set_lrs: 0V
        set_mrs: 0V
        reset: 0V
        search0: 0V
        search1: 0V
    2:
      type: bitline
      cmos_region: drain
      num_cmos: 0
      cmos_width: 0F
      is_nmos: false
      wire_width: 1F
      voltages:
        set_lrs: 1.8V
        set_mrs: 1.8V
        reset: 1.8V
        search0: 1.1V
        search1: 1.1V
