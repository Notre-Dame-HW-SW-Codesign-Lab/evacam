# EvaCAM architecture configuration: ReRAM-3T1R-ISSCC15

design:
  target: CAM
  search_function: EX
  system_process_node: 90nm
  device_roadmap: HP
  temperature: 350K
memory:
  capacity: 512B
  word_width: 64bits
routing:
  type: H-tree
peripherals:
  input:
    buffer: false
    encoder: false
    custom_encoder: false
  output:
    buffer: false
    priority_encoder: false
    accumulator: false
  write_driver: false
sensing:
  internal: true
  amplifier_type: nvsim_cur
wires:
  local:
    type: LocalAggressive
    repeater: RepeatedNone
    low_swing: false
  global:
    type: GlobalAggressive
    repeater: RepeatedNone
    low_swing: false
organization:
  banks:
    total: [1, 1]
    active: [1, 1]
  mats:
    total: [1, 2]
    active: [1, 2]
  mux:
    sense_amp: 1
    output_level1: 1
    output_level2: 1
