# 2FeFET-TCAM-DSE System Configuration
# CAM array and peripheral circuit settings

design:
  target: CAM
  search_function: EX
  process_node: 45nm
  device_roadmap: HP
  temperature: 350K

memory:
  cell_file: ./config/2FeFET_TCAM_DSE/2FeFET_TCAM_DSE_cell_config.yaml
  capacity: 2MB
  word_width: 512bits

routing:
  type: H-tree

peripherals:
  input:
    buffer: false
    encoder: false
    custom_encoder: false
  output:
    buffer: false
    priority_encoder: false
    accumulator: false
  write_driver: false

sensing:
  internal: true
  amplifier_type: nvsim_vol  # options: nvsim_vol, nvsim_cur, self_clock, dual_the
  custom_sense_amp: false

optimization:
  target: WriteLatency  # options: ReadLatency, WriteLatency, ReadDynamicEnergy, WriteDynamicEnergy, ReadEDP, WriteEDP, LeakagePower, Area, Exploration
  buffer_design: latency    # options: latency, area, balance
  row_driver: latency
  priority_encoder: latency

wires:
  local:
    type: LocalConservative   # options: LocalAggressive, LocalConservative, SemiAggressive,
                          #          SemiConservative, GlobalAggressive, GlobalConservative
    repeater: RepeatedNone    # options: RepeatedNone, RepeatedOpt, Repeated5%Penalty, etc.
    low_swing: false
  global:
    type: GlobalAggressive
    repeater: RepeatedNone
    low_swing: false

matchline:
  additional_cap: 0fF
