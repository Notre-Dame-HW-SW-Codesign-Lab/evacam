# PCM-2T2R-JSSC11 System Configuration
# CAM array and peripheral circuit settings

design:
  target: CAM
  search_function: EX
  process_node: 90nm
  device_roadmap: HP
  temperature: 350K

memory:
  cell_file: ./config/PCM-2T2R-JSSC11/PCM-2T2R-JSSC11_cell_config.yaml
  capacity: 128KB
  word_width: 64bits

routing:
  type: H-tree

peripherals:
  input:
    buffer: true
    encoder: false
    custom_encoder: false
  output:
    buffer: false
    priority_encoder: false
    accumulator: false
  write_driver: false

sensing:
  internal: true
  amplifier_type: nvsim_vol  # options: nvsim_vol, nvsim_cur, self_clock, dual_the
  custom_sense_amp: false

optimization:
  target: ReadLatency  # options: ReadLatency, WriteLatency, ReadDynamicEnergy, WriteDynamicEnergy, ReadEDP, WriteEDP, LeakagePower, Area, Exploration
  buffer_design: latency    # options: latency, area, balance
  row_driver: latency
  priority_encoder: latency

wires:
  local:
    type: LocalAggressive   # options: LocalAggressive, LocalConservative, SemiAggressive,
                          #          SemiConservative, GlobalAggressive, GlobalConservative
    repeater: RepeatedNone    # options: RepeatedNone, RepeatedOpt, Repeated5%Penalty, etc.
    low_swing: false
  global:
    type: GlobalAggressive
    repeater: RepeatedNone
    low_swing: false

organization:
  banks:
    total: [4, 2]    # AxB
    active: [4, 2]   # CxD
  mats:
    total: [2, 2]
    active: [2, 2]
  mux:
    sense_amp: 1
    output_level1: 8  # for write only
    output_level2: 1  # for write only

extra:
  "InputEncType": encoding_two_bit
