# EvaCAM architecture configuration: SRAM_16T_28nm

design:
  target: CAM
  search_function: EX
  system_process_node: 28nm
  device_roadmap: HP
  temperature: 350K
memory:
  capacity: 1KB
  word_width: 128bits
routing:
  type: H-tree
peripherals:
  input:
    buffer: true
    encoder: false
    custom_encoder: false
  output:
    buffer: false
    priority_encoder: false
    accumulator: false
  write_driver: false
sensing:
  internal: true
  amplifier_type: nvsim_vol
wires:
  local:
    type: LocalConservative
    repeater: RepeatedNone
    low_swing: false
  global:
    type: GlobalAggressive
    repeater: RepeatedNone
    low_swing: false
organization:
  banks:
    total:
    - 1
    - 1
    active:
    - 1
    - 1
  mats:
    total:
    - 1
    - 1
    active:
    - 1
    - 1
  mux:
    sense_amp: 1
    output_level1: 1
    output_level2: 1
