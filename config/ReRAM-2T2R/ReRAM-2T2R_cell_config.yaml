# ReRAM-2T2R Cell Configuration
# Memory cell definition

cell:
  name: ReRAM-2T2R
  cam_type: TCAM
  type: ReRAM
  cell_process_node: 40nm
  area: 150F^2
  aspect_ratio: 2
access_device:
  type: none
  cmos_width: 8F
  voltage_drop: 0.15V
resistance:
  'on': 327680000ohm
  'off': 327680000000ohm
read:
  mode: voltage
  voltage: 1.1V
  min_sense_voltage: 70mV
write:
  set:
    mode: current
    current: 50uA
    pulse: 10ns
    energy: 1pJ
  reset:
    mode: current
    current: 150uA
    pulse: 10ns
    energy: 1pJ
match:
  cmos_width: 8F
ports:
  row:
    0:
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 10F
      is_nmos: true
      wire_width: 1F
      voltages:
        set_lrs: 3.3V
        set_mrs: 1.1V
        reset: 3.5V
        search0: 1.1V
        search1: 0V
    1:
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 10F
      is_nmos: true
      wire_width: 1F
      voltages:
        set_lrs: 3.3V
        set_mrs: 1.1V
        reset: 3.5V
        search0: 0V
        search1: 1.1V
  column:
    0:
      type: matchline_bitline
      cmos_region: drain
      num_cmos: 2
      cmos_width: 8F
      is_nmos: true
      wire_width: 6F
      voltages:
        set_lrs: 0V
        set_mrs: 0V
        reset: 1.5V
        search0: 0V
        search1: 0V
    1:
      type: bitline
      cmos_region: none
      num_cmos: 0
      cmos_width: 8F
      is_nmos: true
      wire_width: 6F
      voltages:
        set_lrs: 1.5V
        set_mrs: 1.5V
        reset: 0V
        search0: 0V
        search1: 0V
