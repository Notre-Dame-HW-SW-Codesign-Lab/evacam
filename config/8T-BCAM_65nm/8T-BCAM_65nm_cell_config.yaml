      wire_width: 1F
      voltages:
        set_lrs: 0.9V
        set_mrs: 0.9V
        reset: 0V
        search0: 0V
        search1: 0V
  column:
    0:
      type: wordline
      cmos_region: gate
      num_cmos: 4
      cmos_width: 1F
      is_nmos: true
      wire_width: 1F
      voltages:
        set_lrs: 0.9V
        set_mrs: 0.9V
        reset: 0.9V
        search0: 0V
        search1: 0V
    1:
      type: matchline
