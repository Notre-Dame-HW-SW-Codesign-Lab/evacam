# 8T-BCAM-65nm Cell Configuration
# Memory cell definition

cell:
  name: 8T-BCAM-65nm
  cam_type: BCAM
  type: SRAM
  cell_process_node: 65nm
  area: 369F^2
  aspect_ratio: 4
access_device:
  type: cmos
  cmos_width: 1F
  voltage_drop: 0.15V
read:
  mode: voltage
  voltage: 1.2V
  energy: 0.61fJ
  min_sense_voltage: 50mV
multilevel:
  enabled: false
match:
  cmos_width: 1F
ports:
