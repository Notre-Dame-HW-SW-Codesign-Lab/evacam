# 8T-BCAM-65nm System Configuration
# CAM array and peripheral circuit settings

design:
  target: CAM
  search_function: EX
  process_node: 65nm
  device_roadmap: HP
  temperature: 350K

memory:
  cell_file: ./config/8T-BCAM_65nm/8T-BCAM_65nm_cell.yaml
  capacity: 32KB
  word_width: 32bits

routing:
  type: H-tree

peripherals:
  input:
    buffer: true
    encoder: false
    custom_encoder: false
  output:
    buffer: true
    priority_encoder: false
    accumulator: false
  write_driver: false

sensing:
  internal: true
  amplifier_type: nvsim_vol  # options: nvsim_vol, nvsim_cur, self_clock, dual_the
  custom_sense_amp: false

optimization:
  target: Area  # options: ReadLatency, WriteLatency, ReadDynamicEnergy, WriteDynamicEnergy, ReadEDP, WriteEDP, LeakagePower, Area, Exploration
  buffer_design: latency    # options: latency, area, balance
  row_driver: latency
  priority_encoder: latency

wires:
  local:
    type: LocalConservative   # options: LocalAggressive, LocalConservative, SemiAggressive,
                          #          SemiConservative, GlobalAggressive, GlobalConservative
    repeater: RepeatedNone    # options: RepeatedNone, RepeatedOpt, Repeated5%Penalty, etc.
    low_swing: false
  global:
    type: GlobalAggressive
    repeater: RepeatedNone
    low_swing: false

organization:
  banks:
    total: [1, 1]    # AxB
    active: [1, 1]   # CxD
  mats:
    total: [8, 8]
    active: [8, 8]
  mux:
    sense_amp: 1
    output_level1: 1  # for write only
    output_level2: 32  # for write only
