# 2FeFET-MCAM Cell Configuration
# Memory cell definition

cell:
  name: 2FeFET-MCAM
  cam_type: MCAM
  type: FEFETRAM
  cell_process_node: 22nm
  area: 300F^2
  aspect_ratio: 1.76

access_device:
  type: none
  cmos_width: 10F
  voltage_drop: 0.15V

resistance:
  'on': 22900ohm
  'off': 1600Mohm

read:
  mode: voltage
  voltage: 1V
  current: 5.62uA
  power: 5.62uW
  min_sense_voltage: 70mV

write:
  set:
    mode: voltage
    voltage: 4V
    current: 5e-06uA
    pulse: 10ns
    energy: 2e-05pJ
  reset:
    mode: voltage
    voltage: 4V
    current: 5e-07uA
    pulse: 10ns
    energy: 2e-05pJ

multilevel:
  enabled: false

mcam:
  num_resistance_state: 8
  resistance_state: [ 1.616Mohm, 
                      854.7kohm,
                      283.3kohm,
                      108.3kohm,
                      52.91kohm,
                      33kohm,
                      24.39kohm,
                      20.04kohm
                    ]

match:
  cmos_width: 5F
  additional_cap_on_ml: 33fF

ports:
  row:
    0:
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 10F
      is_nmos: true
      wire_width: 1F
      voltages:
        set_lrs: 4V
        set_mrs: 4V
        reset: 4V
        search0: 1V
        search1: 1V
    1:
      type: searchline
      cmos_region: gate
      num_cmos: 1
      cmos_width: 10F
      is_nmos: true
      wire_width: 1F
      voltages:
        set_lrs: 4V
        set_mrs: 4V
        reset: 4V
        search0: 1V
        search1: 1V
  column:
    0:
      type: matchline
      cmos_region: drain
      num_cmos: 1
      cmos_width: 10F
      is_nmos: true
      wire_width: 1F
      voltages:
        set_lrs: 1V
        set_mrs: 1V
        reset: 1V
        search0: 0V
        search1: 1V
    1:
      type: matchline
      cmos_region: drain
      num_cmos: 1
      cmos_width: 10F
      is_nmos: true
      wire_width: 1F
      voltages:
        set_lrs: 1V
        set_mrs: 1V
        reset: 1V
        search0: 0V
        search1: 1V
