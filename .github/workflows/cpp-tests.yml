name: cpp-tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 0"

jobs:
  test-cpp:
    if: github.event_name != 'schedule'
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # Run every test even if one fails, so a single failure does not mask the
      # others.
      fail-fast: false
      matrix:
        target:
          - test-test-support
          - test-derived-values
          - test-config-normalizer
          - test-config-sections
          - test-output-file-lock
          - test-evacam-config
          - test-config-validators
          - test-technology-variation-config
          - test-yaml-primitives
          - test-physical-domain-validators
          - test-cell-memory-loader-branches
          - test-sense-amp-loader-branches
          - test-technology-yaml-branches
          - test-technology
          - test-mem-cell
          - test-formula-coverage
          - test-wire-factory
          - test-function-unit
          - test-decoder-components
          - test-driver-mux-components
          - test-charging-sensing-components
          - test-cam-encoder-components
          - test-cam-input-peripheral-components
          - test-cam-mmr-sense-components
          - test-cam-line
          - test-cam-subarray-topology
          - test-cam-subarray-match
          - test-cam-subarray-variation
          - test-mat-bank
          - test-result-model
          - test-bank-without-htree-factory
          - test-bank-with-htree-coverage
          - test-unit-formatter
          - test-results-serialization
          - test-output-services
          - test-app-services
          - test-subarray-dimension-tester
          - test-evacam-explorer
          - test-pareto-pruner
          - test-deep-exploration-threading
          - test-evacam-match-focused
          - test-run-evacam-boundary
          - test-run-evacam-concurrency
          - test-yaml
          - test-top-level-parser
          - test-cell-loader
          - test-cli-options
          - test-custom-sa-loader
          - test-technology-loader
          - test-new-input-names
          - test-generated-v2-configs
          - test-input-validation
          - test-output-path-builder
          - test-exploration
          - test-variation
          - test-montecarlo
          - test-corner
          - test-wire
          - test-formula
          - test-match
          - test-mat-decoder
          - test-htree-routing
          - test-exhaustive-search
          - test-python-package-data
          - test-config-migration-scripts
          - test-config-sync-script
          - test-generation-scripts
          - test-sweep-analysis-scripts
          - test-plotting-scripts
          - test-inventory-generator
          - test-pybind-match
          - test-pybind-run

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        # python3-config is used by the Makefile's pybind target.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make libyaml-cpp-dev pybind11-dev

      - name: Install Python test dependencies
        run: python -m pip install matplotlib numpy scipy PyYAML tree-sitter-language-pack

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}

  thread-sanitizer:
    name: Clang ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ThreadSanitizer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang make libyaml-cpp-dev

      - name: Run ThreadSanitizer
        if: github.event_name != 'schedule'
        run: make test-thread-sanitizer

      - name: Run scheduled ThreadSanitizer stress
        if: github.event_name == 'schedule'
        run: make TSAN_STRESS_ITERATIONS=5 test-thread-sanitizer

  scheduled-helgrind:
    name: Scheduled Helgrind stress
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Helgrind build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make libyaml-cpp-dev valgrind

      - name: Run Helgrind stress
        run: make test-thread-helgrind

  coverage:
    name: GCC branch coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coverage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make libyaml-cpp-dev
          python3 -m pip install gcovr

      - name: Generate coverage report
        run: make coverage
