name: cpp-tests

on:
  push:
  pull_request:

jobs:
  test-cpp:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # Run every test even if one fails, so a single failure does not mask the
      # others.
      fail-fast: false
      matrix:
        target:
          - test-test-support
          - test-derived-values
          - test-config-normalizer
          - test-config-sections
          - test-output-file-lock
          - test-evacam-config
          - test-config-validators
          - test-technology-variation-config
          - test-yaml-primitives
          - test-physical-domain-validators
          - test-cell-memory-loader-branches
          - test-sense-amp-loader-branches
          - test-technology-yaml-branches
          - test-technology
          - test-mem-cell
          - test-formula-coverage
          - test-wire-factory
          - test-function-unit
          - test-decoder-components
          - test-driver-mux-components
          - test-charging-sensing-components
          - test-yaml
          - test-top-level-parser
          - test-cell-loader
          - test-cli-options
          - test-custom-sa-loader
          - test-technology-loader
          - test-new-input-names
          - test-generated-v2-configs
          - test-input-validation
          - test-output-path-builder
          - test-exploration
          - test-variation
          - test-montecarlo
          - test-corner
          - test-wire
          - test-formula
          - test-match
          - test-mat-decoder
          - test-htree-routing
          - test-exhaustive-search
          - test-python-package-data
          - test-pybind-run

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        # python3-config is used by the Makefile's pybind target.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make libyaml-cpp-dev pybind11-dev

      - name: Install Python plotting dependency
        # EvaCAM shells out to scripts/plot_variation_histograms.py to emit the
        # Monte Carlo histogram SVG; test-montecarlo asserts that plot_file is
        # produced, which requires matplotlib.
        run: python -m pip install matplotlib

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}
