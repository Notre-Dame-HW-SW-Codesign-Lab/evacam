name: python-build

on:
  push:
  pull_request:

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        # pybind11 is pulled from PyPI by the build backend (see pyproject.toml),
        # so only the compiler and yaml-cpp need to come from the system.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libyaml-cpp-dev

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: evacam-wheel
          path: dist/*.whl

  test-python:
    name: Install wheel & run Python tests
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Needed for tests/ and config/ inputs; the package itself comes from
        # the prebuilt wheel, not this source tree.
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: evacam-wheel
          path: dist

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Run pybind smoke test against the installed wheel
        # Run from a clean directory so `import evacam_py` resolves to the
        # installed wheel rather than any local build in the source tree.
        run: |
          cp tests/test_pybind_match.py "${RUNNER_TEMP}/test_pybind_match.py"
          cd "${RUNNER_TEMP}"
          python test_pybind_match.py "${GITHUB_WORKSPACE}/config/2FeFET_TCAM/2FeFET_TCAM_match_system_config.yaml"
