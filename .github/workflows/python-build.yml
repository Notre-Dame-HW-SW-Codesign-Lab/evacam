name: python-build

on:
  push:
  pull_request:

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        # pybind11 is pulled from PyPI by the build backend (see pyproject.toml),
        # so only the compiler and yaml-cpp need to come from the system.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libyaml-cpp-dev

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: evacam-wheel
          path: dist/*.whl

  test-python:
    name: Install wheel & run Python tests
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Needed for tests/ and config/ inputs; the package itself comes from
        # the prebuilt wheel, not this source tree.
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yaml-cpp runtime library
        # The wheel links yaml-cpp dynamically, so the shared library must be
        # present at import time (libyaml-cpp-dev pulls in the matching runtime).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libyaml-cpp-dev

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: evacam-wheel
          path: dist

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Run pybind smoke test against the installed wheel
        # Run from the repo root so the configs' relative paths resolve. A fresh
        # checkout has no evacam_py in the tree (no package dir or .so), so the
        # import still resolves to the installed wheel, not the source.
        run: python tests/test_pybind_match.py config/2FeFET_TCAM/2FeFET_TCAM_match_system_config.yaml
