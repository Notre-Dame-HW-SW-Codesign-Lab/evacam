name: python-build

on:
  push:
  pull_request:

jobs:
  pip-install:
    name: pip install & smoke-test evacam_py
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        # pybind11 is pulled from PyPI by the build backend (see pyproject.toml),
        # so only the compiler and yaml-cpp need to come from the system.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libyaml-cpp-dev

      - name: Build & install from source
        run: python -m pip install -v .

      - name: Import smoke test
        # Run from a clean directory so the import resolves to the installed
        # package, not the source tree.
        run: cd "${RUNNER_TEMP}" && python -c "import evacam_py; print(evacam_py.EvaCAMMatch, evacam_py.EvaCAMMatchResult)"

      - name: Functional smoke test
        run: python tests/test_pybind_match.py config/2FeFET_TCAM/2FeFET_TCAM_match_system_config.yaml
