# WARNING: REFERENCE INPUT ONLY.
# This file shows every supported tool-config field. The referenced architecture
# and cell examples contain placeholder values and are not valid experiments.

# Required input references. Relative paths are resolved from this file.
architecture_file: ./architecture_config_full_example.yaml
cell_file: ./cell_config_full_example.yaml

# Optional. Its presence enables the custom sense-amplifier model.
custom_sense_amplifier_file: ./custom_sense_amp_full_example.yaml

# Required optimization controls.
optimization:
  target: ReadLatency # ReadLatency | WriteLatency | ReadDynamicEnergy | WriteDynamicEnergy | ReadEDP | WriteEDP | LeakagePower | Area | SearchLatency | SearchEnergy | SearchEDP | Exploration
  deep_exploration: false # optional; expands default unpinned exploration domains
  buffer_design: latency # latency | balance | area
  row_driver: latency # latency | balance | area
  priority_encoder: latency # latency | balance | area

# Optional constrained-DSE controls. Behavior is retained from the legacy
# unified format for now and will be revised separately.
design_constraints:
  enabled: false
  read_latency: 1e41s
  write_latency: 1e41s
  read_dynamic_energy: 1e41J
  write_dynamic_energy: 1e41J
  leakage: 1e41W
  area: 1e41
  read_edp: 1e41
  write_edp: 1e41

# Optional exploration controls.
exploration:
  use_cacti_assumption: false
  enable_pruning: false

# Optional modeling controls.
modeling:
  use_updated_lib: false
  exclude_precharge_latency: false
  include_leakage: false # retained for compatibility; currently has no model effect
  scaled_voltage: 1.0 # retained for compatibility; currently has no model effect

# Optional output controls.
output:
  yaml_file: results/example_results.yaml
  exploration_csv_prefix: results/output
