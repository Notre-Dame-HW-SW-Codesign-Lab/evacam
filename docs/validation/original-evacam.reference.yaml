  blockers:
  - DATE22 HSPICE deck and its peripheral loads are unavailable; TCAS19 circuit is
    reconstructed.
  - FeFET effective R/C and inverter output load remain inherited/unspecified.
  - Full-discharge energy envelope does not establish the HSPICE workload activity.
  config: config/original_validation/FeFET-2Fe-TCAS19/FeFET-2Fe-TCAS19.config.yaml
  status: partial_reconstruction
  expected_model:
    matchline_timing_model: analytical_voltage_threshold
    matchline_circuit: direct_nvm
    bits_per_discharge_path: 1
    sense_amplifier_model: analytical_inverter
