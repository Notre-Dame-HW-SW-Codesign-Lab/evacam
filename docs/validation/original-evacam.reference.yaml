    energy: null
    area: null
  comparable:
    latency: false
    energy: false
    area: false
  blockers:
  - With corrected selected-access leakage and two-bit paths the inherited 70mV sense
    requirement is infeasible at the illustrative 0.55/0.45V thresholds.
  - CSRSS transistor sizing, charge-sharing node capacitance, latch and programmable
    reference timing are not specified.
  - Whole die 2.2x2.7mm includes test/reference/IO; it is not an array area target.
  config: config/original_validation/PCM-2T2R-JSSC14/PCM-2T2R-JSSC14.config.yaml
