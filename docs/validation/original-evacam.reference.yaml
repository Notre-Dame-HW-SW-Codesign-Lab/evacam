    energy: false
    area: false
  blockers:
  - SAPIENS uses divider sensing, shared SAs and serial L1 accumulation; generic exact-TCAM
    bank is a different operation.
  - Divider charger, dual thresholds and digital accumulator/control costs need circuit
    characterization.
  - DATE22 area target is a die-photo subset; total SAPIENS core is 0.2mm^2.
  status: unsupported_architecture
sapiens_workload:
  physical_rram_devices: 65536
  devices_per_bit: 2
  subarrays: 8
  vectors_per_subarray: 32
  vector_bits: 128
  sense_amplifiers: 32
  bitline_mux: 8
  bits_per_cycle: 1
  clock_mhz: 200
  power_mw: 3.39
  normalization_vectors: 32
  note: Clock/workload arithmetic is a reconstruction from measured inputs, not an
    independent EvaCAM prediction. 640ns is a 32-vector bank query; eight mux groups
    take 5120ns if processed serially.
