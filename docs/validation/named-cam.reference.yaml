- id: ReRAM-3T1R-ISSCC15
  config: config/paper_reference/ReRAM-3T1R-ISSCC15/ReRAM-3T1R-ISSCC15.config.yaml
  status: partial
  reference:
    latency_ns: 0.96
    kind: silicon
    source: https://picture.iczhiku.com/resource/eetop/syIFhqJDqDgdSnvB.pdf
    locator: ISSCC 2015 paper 17.5, pp. 318-319; DOI 10.1109/ISSCC.2015.7063054
    reported_supply_v: 1.0
  matched_fields:
  - two 64x64 blocks
  - 64-bit word
  - 90nm process
  assumptions:
  - Blocks are modeled as two partitions of entries in one mat; physical placement
    and inter-block routing are assumed.
  - The paper uses voltage-separation sensing and dual-replica enable timing; generic
    voltage sensing replaces the inherited current converter in this reference only.
  - Differential timing uses an ideal reference between all-match and one-miss lines,
    with the inherited 25mV separation; actual reference, offset, replica/control
    delay and MRS/X leakage are unavailable.
  - Bi-directional voltage-divider control is not modeled; search0/search1 asymmetry
    and internal node load remain unmatched.
  - Paper supply is 1V; the generic 90nm current tables are characterized at 1.2V
    and are retained. Changing Vdd alone would give inconsistent on-resistance.
  - Broadcast control, input/precharge overlap and zero recovery are explicit scheduling
    assumptions; measured chip delay excludes the external test path.
  expected:
    node_nm: 90
    entries: 128
    word_bits: 64
    subarray:
    - 64
    - 64
    subarray_count: 2
    sensing_mode: nvsim_vol
    matchline_timing_model: analytical_differential
    search_timing:
      control: broadcast
      precharge: overlap_input
      driver_load: physical_line
