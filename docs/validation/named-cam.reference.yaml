schema: named_cam_reference
version: 1
common_assumptions:
- Legacy PTM technology, wire rules, device sizes and resistances are retained unless
  listed as matched.
- Existing temperature and port biases are retained; they are not established paper
  operating corners.
- Generic NVSim sensing is retained; no delay, energy or resistance is fitted to the
  paper result.
- Bank search latency includes the configured peripherals and precharge. Paper timing
  boundaries remain unresolved.
- Cell area is an input; matching it is not independent area validation.
cases:
- id: FeFET-2Fe1T-DATE21
  config: config/paper_reference/FeFET-2Fe1T-DATE21/FeFET-2Fe1T-DATE21.config.yaml
  status: partial
  reference:
    latency_ns: 0.2528
    kind: circuit_simulation
    source: https://past.date-conference.com/proceedings-archive/2021/pdf/1478.pdf
    locator: Table I, 2FeFET-1T column; Section IV-A
    cell_area_um2: 0.36
    energy_fj_per_bit: 0.195
  matched_fields:
  - 45nm process
  - 0.36um^2 cell footprint
  - separate CMOS matchline pull-down
  assumptions:
  - The inherited 64x64 array is not specified alongside Table I; array size and energy
    scope remain unmatched.
  - The paper uses compact FeFET devices and minimum-size PTM MOSFETs; this fixture
    retains the inherited device abstraction.
  - The fefet_gate topology models the two FeFET branches as resistors driving a CMOS
    gate, with PTM terminal capacitances and a 0.5V switching assumption; no compact-model
    transient calibration.
  - The paper uses an inverter sense amplifier; generic NVSim voltage sensing remains
    until its load, delay, energy and sizing are independently characterized.
  - Gate-node energy conservatively charges every compared control node from zero
    to mismatch voltage; paper activity is not matched.
  - Analytical inverter decision assumes a 0.5V matchline trip point; broadcast control,
    input/precharge overlap and zero recovery are explicit scheduling assumptions.
  expected:
    cell_topology: fefet_gate
    node_nm: 45
    entries: 64
    word_bits: 64
    subarray:
    - 64
    - 64
    subarray_count: 1
    sensing_mode: nvsim_vol
    matchline_timing_model: analytical_voltage_threshold
    search_timing:
      control: broadcast
      precharge: overlap_input
      driver_load: physical_line
    cell_area_um2: 0.36
