# WARNING: REFERENCE INPUT ONLY.
# This file intentionally contains nonsense/example values that do NOT map to a real design.
# DO NOT run EvaCAM with this file for any legitimate analysis or published results.
# This file exists only to show supported/expected custom sense amplifier input fields.
#
# Reference this file from the tool config with:
#
# custom_sense_amplifier_file: ./custom_sense_amp_full_example.yaml
#
# "Required" means required when this file is referenced by the tool config.

# Required top-level section. The parser also accepts these fields directly at
# the file root, but this explicit section is preferred for new inputs.
custom_sense_amp:
  # Required geometry. Either provide area, or provide both height and width.
  # If height and width are provided, area is derived as height * width.
  height: 10F # optional with area; units: F
  width: 4F # optional with area; units: F
  area: 0.001um^2 # optional with height and width; units: m^2 | cm^2 | mm^2 | um^2 | nm^2

  latency: 20ps # required; units: s | ms | us | ns | ps | fs
  energy: 4pJ # required; units: J | mJ | uJ | nJ | pJ | fJ
  cap_load: 2fF # required; units: F | mF | uF | nF | pF | fF
  leakage: 10pW # optional; units: W | mW | uW | nW | pW
