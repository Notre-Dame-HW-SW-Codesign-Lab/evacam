# WARNING: REFERENCE INPUT ONLY.
# This file intentionally contains nonsense/example values that do NOT map to a real design.
# DO NOT run EvaCAM with this file for any legitimate analysis or published results.
# This file exists only to show supported/expected system input fields in one place.
#
# "Required" means required by the YAML parser. Some parsed values are still
# rejected by runtime validation when the current CAM model does not support them.

# Required section. Required keys: target, search_function, system_process_node,
# device_roadmap, temperature.
design:
  target: CAM # required enum; currently only CAM is supported
  search_function: EX # required enum: EX | BE | TH
  system_process_node: 40nm # required; authoritative modeled technology node today; practical units: um | nm
  device_roadmap: HP # required enum: HP | LSTP | LOP | FEFET | LP
  temperature: 350K # required; units: K

# Required section. Required keys: cell_file, word_width.
# capacity is parser-optional, but runtime-required unless fixed subarray dimensions derive it.
memory:
  cell_file: ./config/example/example_full_cell_config.yaml # required string path
  capacity: 8KB # optional only with organization.subarray.dimensions; units: B | Byte | KB | MB | GB
  word_width: 256bits # required; units: bit | bits

# Required section. Required keys: type.
routing:
  type: H-tree # required enum: H-tree | non_h_tree; non_h_tree parses but is rejected today

# Required section. Required keys: input, output, write_driver.
peripherals:
  input:
    buffer: true # required bool
    encoder: false # required bool
    custom_encoder: false # required bool; true is parsed but rejected today
  output:
    buffer: true # required bool
    priority_encoder: true # required bool
    accumulator: false # required bool
  write_driver: true # required bool

# Required section. Required keys: internal, amplifier_type, custom_sense_amp.
sensing:
  internal: true # required bool; external sensing is only supported for SRAM CAM cells
  amplifier_type: nvsim_vol # required enum: nvsim_vol | nvsim_cur | self_clock | dual_the | discharge; CAM currently supports nvsim_vol, nvsim_cur, discharge
  custom_sense_amp: false # required bool; true requires advanced.custom_sa_input_file

# Required section. Required keys: target, buffer_design, row_driver, priority_encoder.
optimization:
  target: ReadLatency # required enum: ReadLatency | WriteLatency | ReadDynamicEnergy | WriteDynamicEnergy | ReadEDP | WriteEDP | LeakagePower | Area | SearchLatency | SearchEnergy | SearchEDP | Exploration
  deep_exploration: false # optional bool; expands default exploration domains when explicit organization pinning is omitted
  buffer_design: latency # required enum: latency | area | balance
  row_driver: latency # required enum: latency | area | balance
  priority_encoder: latency # required enum: latency | area | balance

# Required section. Required keys: local, global.
# Each wire subsection requires: type, repeater, low_swing.
wires:
  local:
    type: LocalAggressive # required enum: LocalAggressive | LocalConservative | SemiAggressive | SemiConservative | GlobalAggressive | GlobalConservative | DramWordline
    repeater: RepeatedNone # required enum: RepeatedNone | RepeatedOpt | Repeated5%Penalty | Repeated10%Penalty | Repeated20%Penalty | Repeated30%Penalty | Repeated40%Penalty | Repeated50%Penalty
    low_swing: false # required bool; true is only supported with RepeatedNone
  global:
    type: GlobalAggressive # required enum: LocalAggressive | LocalConservative | SemiAggressive | SemiConservative | GlobalAggressive | GlobalConservative | DramWordline
    repeater: RepeatedNone # required enum: RepeatedNone | RepeatedOpt | Repeated5%Penalty | Repeated10%Penalty | Repeated20%Penalty | Repeated30%Penalty | Repeated40%Penalty | Repeated50%Penalty
    low_swing: false # required bool; true is only supported with RepeatedNone

# Optional parsed section. The top-level key array: is also accepted as a legacy
# alias for organization:.
# If this section is omitted, EvaCAM uses default exploration ranges. If
# optimization.deep_exploration is true, those default ranges are wider.
organization:
  # Optional unless subarray.dimensions is present. If banks is present, total
  # and active are required.
  banks:
    total: [1, 1] # [row mats, column mats]
    active: [1, 1] # [active mats per column, active mats per row]
  # Optional unless subarray.dimensions is present. If mats is present, total
  # and active are required.
  mats:
    total: [1, 8] # [row subarrays, column subarrays]
    active: [1, 8] # [active subarrays per column, active subarrays per row]
  # Optional fixed physical subarray dimensions. Only supported for fixed
  # non-DSE configs, so not with optimization.target: Exploration or
  # optimization.deep_exploration: true.
  subarray:
    dimensions: [32, 256] # [rows, columns]; requires banks and mats; derives or validates memory.capacity
  # Optional. Each mux field is optional if mux is present.
  mux:
    sense_amp: 1 # optional int
    output_level1: 8 # optional int
    output_level2: 1 # optional int

# Optional parsed section. Required if matchline is present: additional_cap.
matchline:
  additional_cap: 0fF # units: F | mF | uF | nF | pF | fF

# Optional parsed section. All fields are optional. Setting any limit enables
# constraints; enabled: true alone uses the default very-loose limits.
constraints:
  enabled: false # optional bool
  read_latency: 1e41s # optional; units: s | ms | us | ns | ps | fs
  write_latency: 1e41s # optional; units: s | ms | us | ns | ps | fs
  read_dynamic_energy: 1e41J # optional; units: J | mJ | uJ | nJ | pJ | fJ
  write_dynamic_energy: 1e41J # optional; units: J | mJ | uJ | nJ | pJ | fJ
  leakage: 1e41W # optional; units: W | mW | uW | nW | pW
  area: 1e41 # optional scalar area limit
  read_edp: 1e41 # optional scalar
  write_edp: 1e41 # optional scalar

# Optional parsed section.
advanced:
  max_nmos_size: 10F # optional; units: F (feature-size multiple)
  use_cacti_assumption: false # optional bool; overrides several organization defaults when true
  enable_pruning: false # optional bool; used with optimization.target: Exploration
  bit_serial_width: 256bits # optional; units: bit | bits
  input_encoder_type: encoding_two_bit # optional enum; currently only encoding_two_bit is supported
  custom_sa_input_file: ./models/custom_sa.yaml # optional YAML path; required when sensing.custom_sense_amp is true
  use_updated_lib: false # optional bool
  exclude_precharge_latency: false # optional bool
  include_leakage: false # optional bool
  scaled_voltage: 1.0 # optional scalar; >0 scales dynamic energy by voltage squared

# Optional parsed section. These are NVSim knobs for caches; design.target currently
# only supports CAM, so access_mode mainly remains for compatibility.
cache:
  associativity: 1 # optional int; current CAM bank path uses effective associativity 1
  access_mode: normal # optional enum: normal | fast | sequential

# Optional parsed section. System-level NAND flash organization, distinct from
# cell-level flash device parameters.
flash:
  page_size: 4KB # optional; units: B | Byte | KB | MB | GB
  block_size: 256KB # optional; units: B | Byte | KB | MB | GB

# Optional parsed section. All fields are optional.
extra:
  real_capacity: 9KB # optional; required when memory.word_width is not a power of two; units: B | Byte | KB | MB | GB
  output_yaml_file: results/example_results.yaml # optional string path; overrides default results YAML path
  output_file_prefix: output # optional string; affects exploration CSV naming
  worst_case_sense_margin: 30mV # optional; units: V | mV
  max_driver_current: 0uA # optional; units: A | mA | uA | nA | pA
