# WARNING: REFERENCE INPUT ONLY.
# This file intentionally contains nonsense/example values that do NOT map to a real device.
# DO NOT run EvaCAM with this file for any legitimate analysis or published results.
# This file exists only to show supported/expected cell input fields in one place.
#
# "Required" means required by the YAML parser. Some optional fields default to 0 or
# another legacy value, so omitting them can still make a physically meaningless run.

# Required section. Required keys: type, cell_process_node, area, aspect_ratio.
# Optional keys: name, cam_type.
cell:
  name: Example-Full # optional string
  type: memristor # required enum: SRAM | DRAM | eDRAM | MRAM | PCRAM | ReRAM/memristor | FBRAM | SLCNAND | MLCNAND | FEFETRAM
  cam_type: TCAM # optional enum: TCAM | BCAM | MCAM | ACAM; defaults/inferred to TCAM if omitted
  cell_process_node: 40nm # required; practical units: um | nm
  area: 157F^2 # required; units: F^2
  aspect_ratio: 2.0 # required scalar

# Optional parsed section. Required if access_device is present: type.
access_device:
  type: cmos # enum: CMOS | BJT | diode | none; parsed case-insensitively
  cmos_width: 10F # optional; units: F (feature-size multiple)
  voltage_drop: 0.15V # optional; units: V | mV
  leakage_current: 0uA # optional; units: A | mA | uA | nA | pA

# Optional parsed section.
# on/off may also be written as boolean YAML keys true/false for legacy compatibility.
resistance:
  on: 400ohm # optional; units: ohm | kohm | Mohm | Gohm
  off: 300kohm # optional; units: ohm | kohm | Mohm | Gohm
  at_set:
    on: 400ohm # optional; units: ohm | kohm | Mohm | Gohm
    off: 300kohm # optional; units: ohm | kohm | Mohm | Gohm
  at_reset:
    on: 450ohm # optional; units: ohm | kohm | Mohm | Gohm
    off: 320kohm # optional; units: ohm | kohm | Mohm | Gohm
  at_read:
    on: 400ohm # optional; units: ohm | kohm | Mohm | Gohm
    off: 300kohm # optional; units: ohm | kohm | Mohm | Gohm
  at_half_read:
    on: 500ohm # optional; units: ohm | kohm | Mohm | Gohm
    off: 500kohm # optional; units: ohm | kohm | Mohm | Gohm
  at_half_reset:
    on: 480ohm # optional; units: ohm | kohm | Mohm | Gohm

# Optional parsed section. Used by CAM/NVM capacitance paths.
capacitance:
  on: 0fF # optional; units: F | mF | uF | nF | pF | fF
  off: 0fF # optional; units: F | mF | uF | nF | pF | fF

# Optional parsed section. Used by FBRAM/SOI device paths.
device:
  gate_ox_thickness_factor: 1.0 # optional scalar
  soi_width: 0F # optional; units: F (feature-size multiple)

# Optional parsed section. Required if read is present: mode.
read:
  mode: current # enum: voltage | current
  voltage: 0V # optional; units: V | mV
  current: 50uA # optional; units: A | mA | uA | nA | pA
  power: 30uW # optional; units: W | mW | uW | nW | pW
  energy: 0fJ # optional; units: J | mJ | uJ | nJ | pJ | fJ
  min_sense_voltage: 25mV # optional; units: V | mV
  wordline_boost_ratio: 1.0 # parsed, but no current model effect
  read_floating: false # parsed, but no current model effect

# Optional parsed section.
# Required if write.set is present: mode.
# Required if write.reset is present: mode.
write:
  set:
    mode: current # enum: voltage | current
    voltage: 0V # optional; units: V | mV
    current: 150uA # optional; units: A | mA | uA | nA | pA
    pulse: 10ns # optional; units: s | ms | us | ns | ps | fs
    energy: 1pJ # optional; units: J | mJ | uJ | nJ | pJ | fJ
  reset:
    mode: current # enum: voltage | current
    voltage: 0V # optional; units: V | mV
    current: 150uA # optional; units: A | mA | uA | nA | pA
    pulse: 10ns # optional; units: s | ms | us | ns | ps | fs
    energy: 1pJ # optional; units: J | mJ | uJ | nJ | pJ | fJ

# Optional parsed section. Used by DRAM/eDRAM paths.
dram:
  cell_capacitance: 0fF # optional; units: F | mF | uF | nF | pF | fF

# Optional parsed section. Used by SRAM paths.
sram:
  nmos_width: 0F # optional; units: F (feature-size multiple)
  pmos_width: 0F # optional; units: F (feature-size multiple)

# Optional parsed section. Used by NAND flash paths.
flash:
  erase_voltage: 0V # optional; units: V | mV
  program_voltage: 0V # optional; units: V | mV
  pass_voltage: 0V # optional; units: V | mV
  erase_time: 0ms # optional; units: s | ms | us | ns | ps | fs
  program_time: 0us # optional; units: s | ms | us | ns | ps | fs
  gate_coupling_ratio: 0.0 # optional scalar
  # mlc is not a supported key; current code derives this from cell.type.

# Legacy compatibility section. This block appears in shipped configs but is not
# currently read by the YAML loader.
multilevel:
  enabled: false # ignored

# Optional parsed section. Used by the current variation path.
variation:
  with_variation: false # optional bool
  # single_point and monte_carlo use bounded-Gaussian stdev fields.
  # corner uses deterministic max_var fields.
  mode: single_point # optional enum: single_point | monte_carlo | corner
  monte_carlo_granularity: cell # optional enum for monte_carlo: cell | effective
  lut_file: ./variation_lut.csv # optional path; accepted and propagated but not consumed yet
  samples: 9 # optional int; required for monte_carlo and must be > 1; ignored for corner
  seed: 12345 # optional uint32; mainly for reproducible testing; ignored for corner
  memory_device_resistance_on_stdev: 0% # optional; fraction or percent
  memory_device_resistance_off_stdev: 0% # optional; fraction or percent
  memory_device_resistance_on_max_var: 0% # optional for corner; fraction or percent
  memory_device_resistance_off_max_var: 0% # optional for corner; fraction or percent

# Optional parsed section, but current model code does not use these values.
mcam:
  num_resistance_state: 0 # optional int
  resistance_state: [] # optional sequence or map keyed by integer state index; resistance units: ohm | kohm | Mohm | Gohm; bare numbers default to ohm
  ml_precharge_voltage: [] # optional sequence or map keyed by integer state index; voltage units: V | mV; bare numbers default to V
  searchline_voltage: [] # optional sequence or map keyed by integer state index; voltage units: V | mV; bare numbers default to V
  state_variation: [] # optional sequence or map keyed by integer state index; fraction or percent

# Optional parsed section. Used by CAM/NVM match paths.
match:
  cmos_width: 4F # optional; units: F (feature-size multiple)
  is_nvm_discharge: false # optional bool

# Optional parsed section. Required for CAM-style cells that use explicit row/column ports.
# Each row/column entry requires: type, cmos_region, num_cmos, cmos_width, is_nmos, wire_width.
ports:
  row: # map by integer key
    0:
      type: wordline # enum: Wordline | Sourceline | Searchline | Bitline | Dataline | Matchline | Matchline_Bitline | Searchline_Bitline; parsed case-insensitively
      cmos_region: gate # enum: gate | source | drain | diode | none
      num_cmos: 1 # required int
      cmos_width: 12F # required; units: F (feature-size multiple)
      is_nmos: true # required bool
      leak: false # optional bool
      is_nvm_discharge: false # optional bool
      wire_width: 1F # required; units: F (feature-size multiple)
      voltages: # optional map
        set_lrs: 3.5V # optional; units: V | mV
        set_mrs: 3.5V # optional; units: V | mV
        reset: 3.5V # optional; units: V | mV
        search0: 2.5V # optional; units: V | mV
        search1: 0V # optional; units: V | mV
    1:
      type: wordline # enum: Wordline | Sourceline | Searchline | Bitline | Dataline | Matchline | Matchline_Bitline | Searchline_Bitline; parsed case-insensitively
      cmos_region: gate # enum: gate | source | drain | diode | none
      num_cmos: 1 # required int
      cmos_width: 12F # required; units: F (feature-size multiple)
      is_nmos: true # required bool
      leak: false # optional bool
      is_nvm_discharge: false # optional bool
      wire_width: 1F # required; units: F (feature-size multiple)
      voltages:
        set_lrs: 3.5V # optional; units: V | mV
        set_mrs: 3.5V # optional; units: V | mV
        reset: 3.5V # optional; units: V | mV
        search0: 2.5V # optional; units: V | mV
        search1: 0V # optional; units: V | mV
  column: # map by integer key
    0:
      type: matchline # enum: Wordline | Sourceline | Searchline | Bitline | Dataline | Matchline | Matchline_Bitline | Searchline_Bitline; parsed case-insensitively
      cmos_region: drain # enum: gate | source | drain | diode | none
      num_cmos: 1 # required int
      cmos_width: 12F # required; units: F (feature-size multiple)
      is_nmos: true # required bool
      leak: false # optional bool
      is_nvm_discharge: false # optional bool
      wire_width: 2F # required; units: F (feature-size multiple)
      voltages:
        set_lrs: 3.5V # optional; units: V | mV
        set_mrs: 3.5V # optional; units: V | mV
        reset: 3.5V # optional; units: V | mV
        search0: 1.1V # optional; units: V | mV
        search1: 0V # optional; units: V | mV
    1:
      type: bitline # enum: Wordline | Sourceline | Searchline | Bitline | Dataline | Matchline | Matchline_Bitline | Searchline_Bitline; parsed case-insensitively
      cmos_region: drain # enum: gate | source | drain | diode | none
      num_cmos: 1 # required int
      cmos_width: 12F # required; units: F (feature-size multiple)
      is_nmos: true # required bool
      leak: false # optional bool
      is_nvm_discharge: false # optional bool
      wire_width: 1F # required; units: F (feature-size multiple)
      voltages:
        set_lrs: 3.5V # optional; units: V | mV
        set_mrs: 3.5V # optional; units: V | mV
        reset: 3.5V # optional; units: V | mV
        search0: 0V # optional; units: V | mV
        search1: 1.1V # optional; units: V | mV
